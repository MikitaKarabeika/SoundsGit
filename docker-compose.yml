version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16.2
    container_name: flicktion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}

      POSTGRES_MOK_USER: ${POSTGRES_MOK_USER}
      MOK_USER_PASSWORD: ${MOK_USER_PASSWORD}
      POSTGRES_MOF_USER: ${POSTGRES_MOF_USER}
      MOF_USER_PASSWORD: ${MOF_USER_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: flicktion-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata_local: