paypal.api.base-url=http://nginx/paypal-proxy
paypal.client-id=${PAYPAL_CLIENT_ID:test-paypal-client-id}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:test-paypal-client-secret}
paypal.currency=${PAYPAL_CURRENCY:PLN}
paypal.return-url=${PAYPAL_RETURN_URL:https://team-2.proj-sum.it.p.lodz.pl/orders/payment/success}
paypal.cancel-url=${PAYPAL_CANCEL_URL:https://team-2.proj-sum.it.p.lodz.pl/orders/payment/cancel}

