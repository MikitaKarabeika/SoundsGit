stripe.api.key=${STRIPEAPIKEY}
app.frontend.url=https://team-2.proj-sum.it.p.lodz.pl
api.stripe.url=http://nginx/stripe-proxy
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
#retry
app.transaction.retry.maxAttempts=3
app.transaction.retry.backoffMs=500

