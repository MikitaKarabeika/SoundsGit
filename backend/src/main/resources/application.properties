#captcha (reCAPTCHA)
app.captcha.enabled=${CAPTCHA_ENABLED:true}
app.captcha.verify-url=${CAPTCHA_VERIFY_URL:http://nginx/recaptcha-proxy/api/siteverify}
app.captcha.secret=${RECAPTCHA_SECRET:test-recaptcha-secret}
app.captcha.timeout-seconds=8

