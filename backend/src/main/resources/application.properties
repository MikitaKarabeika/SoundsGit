debug=true

spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true


spring.datasource.mof.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.mof.username=${POSTGRES_MOF_USER}
spring.datasource.mof.password=${MOF_USER_PASSWORD}
spring.datasource.mof.driver-class-name=org.postgresql.Driver
spring.datasource.mof.name=mofDS


spring.datasource.mok.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.mok.username=${POSTGRES_MOK_USER}
spring.datasource.mok.password=${MOK_USER_PASSWORD}
spring.datasource.mok.driver-class-name=org.postgresql.Driver
spring.datasource.mok.name=mokDS



flyway.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
flyway.datasource.username=${POSTGRES_ADMIN_USER}
flyway.datasource.password=${POSTGRES_ADMIN_PASSWORD}
flyway.datasource.driver-class-name=org.postgresql.Driver
flyway.datasource.name=flywayDS
spring.flyway.schemas=public

spring.flyway.table=flyway_schema_history 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.flyway.enabled=true
logging.level.org.flywaydb=DEBUG

mof.flyway.enabled=true
mok.flyway.enabled=true


spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.cache=INFO
logging.level.org.hibernate.stat=INFO


jwt.secret=${JWT_SECRET}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH}
# EXPMSG - threshold (in seconds) before access token expiry when FE should show "session expiring soon" warning
jwt.session.warning-threshold-seconds=60

jws.secret=${JWS_SECRET}



#mail
spring.mail.host=mail-relay
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.protocol=smtp
spring.mail.username=${MAIL_USERNAME}
mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


#localization
spring.messages.basename=messages
spring.messages.encoding=UTF-8



#google-api
google.client.id=${GOOGLE_CLIENT_ID:test-google-client-id}
google.client.secret=${GOOGLE_CLIENT_SECRET:test-google-client-secret}
google.oauth.token-url=${GOOGLE_OAUTH_TOKEN_URL:https://oauth2.googleapis.com/token}
google.oauth.user-info-url=${GOOGLE_OAUTH_USER_INFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/auth/google/callback}

#automatic deactivation because of inactivity for x days
account.inactivity.limit.days=30
account.verification.token.validity.hours=24

#blocking after x tries for y hours
security.account.tries.to-lock=3
security.account.lock-duration-hours=24

