spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.mok.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:flicktion}
spring.datasource.mok.username=${POSTGRES_MOK_USER:mok_user}
spring.datasource.mok.password=${MOK_USER_PASSWORD}

flyway.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:flicktion}
flyway.datasource.username=${POSTGRES_ADMIN_USER:postgres}
flyway.datasource.password=${POSTGRES_ADMIN_PASSWORD}

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=${MAIL_USERNAME:local@flicktion.test}
spring.mail.password=
spring.mail.properties.mail.smtp.ssl.enable=false
mail.username=${MAIL_USERNAME:local@flicktion.test}

app.captcha.enabled=false
app.captcha.verify-url=http://localhost:8080/disabled
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
paypal.api.base-url=https://api-m.sandbox.paypal.com
paypal.return-url=${app.frontend.url}/orders/payment/success
paypal.cancel-url=${app.frontend.url}/orders/payment/cancel
api.stripe.url=https://api.stripe.com
app.translation.mymemory.base-url=https://api.mymemory.translated.net/get
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
jwt.secret=${JWT_SECRET:local-development-jwt-signing-secret-change-before-deploy}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:900000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:604800000}
jws.secret=${JWS_SECRET:local-development-jws-signing-secret-change-before-deploy}
stripe.api.key=${STRIPEAPIKEY:sk_test_local}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:local-test-webhook-secret}
eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.discovery.enabled=false
